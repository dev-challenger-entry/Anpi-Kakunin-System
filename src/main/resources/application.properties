spring.application.name=StudySpring

# ==================================================
# サーバー設定
# ==================================================

server.port=${PORT:8080}


# ==================================================
# Spring Profile
# ==================================================

spring.profiles.active=dev


# ==================================================
# MySQL / DataSource
# ==================================================

# RailwayのPrivate Network経由でMySQLへ接続
spring.datasource.url=${MYSQL_URL}

# MYSQL_PRIVATE_URLに接続情報が含まれているため、
# Railwayが案内するURL形式をそのまま使用
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==================================================
# SQL初期化
# ==================================================

# 外部DBに対してschema.sql / data.sqlを起動時に実行
spring.sql.init.mode=always

# JPAによるテーブル作成後にdata.sqlを実行
spring.jpa.defer-datasource-initialization=true


# ==================================================
# JPA / Hibernate
# ==================================================

# エンティティからテーブルを自動作成・更新
spring.jpa.hibernate.ddl-auto=update

# SQLをコンソールに表示
spring.jpa.show-sql=true

# SQLを見やすく整形
spring.jpa.properties.hibernate.format_sql=true


# ==================================================
# セッション設定
# ==================================================

# セッション有効時間
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

# セッションCookie名
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:SESSION}

# HTTPS環境ではRailway側でtrueにする
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# JavaScriptからCookieへアクセスできないようにする
server.servlet.session.cookie.http-only=${SESSION_COOKIE_HTTPONLY:true}

# CookieのSameSite設定
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}