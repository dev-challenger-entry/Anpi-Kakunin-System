spring.application.name=StudySpring
##Eclipseでの開発時に新たに追加した項目

##以下を記入することで個々人のローカル環境に合わせて、その都度、対応できるようになる
server.port=${PORT:8080}

#Spring Bootが「このデータベースは自動実行対象ではない」と判断してしまっていたことを解決する１文
spring.sql.init.mode=always

#Spring Boot + JPA + data.sql の組み合わせで実行しようとするとこれがないとダメらしい
#JPA（Hibernateなど）によるテーブル自動生成より後に、data.sql・schema.sqlの実行を遅らせる
#ymlの階層構造を活用してもいいかもしれない
spring.jpa.defer-datasource-initialization=true

#MySQL用のデータベース駆動（ドライバー）の指定
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------
# (オプション) Hibernate・JPAの便利な設定
# --------------------------------------------------
# 起動時にエンティティから自動でテーブルを作成・更新する設定（開発時のみ update にするのがおすすめ）
spring.jpa.hibernate.ddl-auto=update

# 実行されたSQL文をコンソール（ログ）に綺麗に表示する
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DB_USER環境変数があればそれを使い、なければデフォルトで「root」を使う設定
spring.datasource.username=${DB_USER:root}
# パスワードも同様に環境変数化するのがおすすめです（デフォルトは空）
# ただ、自分のパソコンのデータベースにパスワードを設定している場合は、.env などに設定がどうしても必要
spring.datasource.password=${DB_PASSWORD:}

#ログインセッション関係の設定
server.servlet.session.timeout=${SESSION_TIMEOUT}
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE}
server.servlet.session.cookie.http-only=${SESSION_COOKIE_HTTPONLY}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE}