spring.application.name=StudySpring
##Eclipseでの開発時に新たに追加した項目
#既に、ローカルポートが占領されていた場合に以下の設定が必要となる
##以下は個々人のローカル環境に合わせて、その都度、修正すること
 server.port=8080
# Spring Bootの設定ファイルに記述する「H2データベースの接続設定」
spring.datasource.url=jdbc:h2:file:./data/safety_check
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console