plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 以下は、Javaプログラムからデータベースに接続し、データを操作するための仕組み
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
	//.envファイル（環境変数を書き込んだ設定ファイル）を自動的に読み込むためのライブラリ。
	//Spring Boot 4専用モジュールを、開発時のみ有効なdevelopmentOnlyスコープで導入する。
	//（本番Docker環境では.env自体を使わず、docker-compose.ymlのenvironmentから
	//  直接システム環境変数を注入するため、本番ビルドにこのライブラリを含める必要はない）
	implementation platform('me.paulschwarz:spring-dotenv-bom:5.1.0')
	developmentOnly 'me.paulschwarz:springboot4-dotenv'
	//パスワードをハッシュ化させるために以下の依存関係を追加する必要がある
	implementation 'org.springframework.security:spring-security-crypto'
    //ビルドツール Gradle において、MySQL データベースへ接続するための公式 JDBC ドライバ（MySQL Connector/J）を依存関係に追加する記述
    runtimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
	useJUnitPlatform()
}
